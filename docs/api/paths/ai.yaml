ai-receipt-scan:
  post:
    tags:
      - AI
    summary: Scan Receipt
    description: |
      Snap a photo of a receipt and import the items into your shopping list or inventory.
      Uses Amazon Textract for OCR and Bedrock for item categorisation.
      Receipt is saved to history for price tracking and easy returns.
    operationId: scanReceipt
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            properties:
              image:
                type: string
                format: binary
              destination:
                type: string
                enum: [shopping_list, inventory, both]
                default: shopping_list
                description: Where to import the items
              listId:
                type: string
                format: uuid
                description: Shopping list to add items to (if destination includes shopping_list)
            required:
              - image
        application/json:
          schema:
            type: object
            properties:
              imageBase64:
                type: string
              mimeType:
                type: string
                enum: [image/jpeg, image/png, image/webp, image/gif]
              destination:
                type: string
                enum: [shopping_list, inventory, both]
                default: shopping_list
              listId:
                type: string
                format: uuid
            required:
              - imageBase64
              - mimeType
    responses:
      '200':
        description: Receipt scanned and items extracted
        content:
          application/json:
            schema:
              $ref: '../schemas/ai.yaml#/AIReceiptResult'
      '400':
        description: Invalid image or could not read receipt
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
      '429':
        description: AI rate limit exceeded
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'

ai-generate-recipe:
