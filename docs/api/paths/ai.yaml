ai-import-paper-list:
  post:
    tags:
      - AI
    summary: Import Paper Shopping List
    description: |
      Snap a photo of a handwritten shopping list on paper and AI will extract
      the items and create a digital shopping list.
    operationId: importPaperList
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            properties:
              image:
                type: string
                format: binary
              listName:
                type: string
                maxLength: 100
                description: Name for the new list
                example: Paper List Import
            required:
              - image
        application/json:
          schema:
            type: object
            properties:
              imageBase64:
                type: string
              mimeType:
                type: string
                enum: [image/jpeg, image/png, image/webp, image/gif]
              listName:
                type: string
                maxLength: 100
            required:
              - imageBase64
              - mimeType
    responses:
      '200':
        description: Paper list imported
        content:
          application/json:
            schema:
              $ref: '../schemas/ai.yaml#/AIShoppingListResult'
      '400':
        description: Could not read the list
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
      '429':
        description: AI rate limit exceeded
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'

