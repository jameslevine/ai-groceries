ai-photo-to-recipe:
  post:
    tags:
      - AI
    summary: Photo to Recipe
    description: |
      Snap a photo of any dish and get its full recipe including step-by-step directions,
      ingredients, and nutrition information. Uses Amazon Bedrock (Claude) for multi-modal analysis.
    operationId: photoToRecipe
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            properties:
              image:
                type: string
                format: binary
                description: Photo of the dish (JPEG, PNG, WebP, GIF. Max 10MB)
            required:
              - image
        application/json:
          schema:
            type: object
            properties:
              imageBase64:
                type: string
                description: Base64 encoded image
              mimeType:
                type: string
                enum: [image/jpeg, image/png, image/webp, image/gif]
            required:
              - imageBase64
              - mimeType
    responses:
      '200':
        description: Recipe identified from photo
        content:
          application/json:
            schema:
              $ref: '../schemas/ai.yaml#/AIRecipeResult'
      '400':
        description: Invalid image or unsupported format
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
      '422':
        description: Could not identify a dish in the image
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
      '429':
        description: AI rate limit exceeded
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'

ai-photo-to-list:
  post:
    tags:
      - AI
    summary: Photo to Shopping List
    description: |
      Snap a photo of items you have at home and AI will generate a shopping list for you.
      Can also import a handwritten paper shopping list by photographing it.
    operationId: photoToList
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            properties:
              image:
                type: string
                format: binary
              addToListId:
                type: string
                format: uuid
                description: Existing list to add items to (optional)
            required:
              - image
        application/json:
          schema:
            type: object
            properties:
              imageBase64:
                type: string
              mimeType:
                type: string
                enum: [image/jpeg, image/png, image/webp, image/gif]
              addToListId:
                type: string
                format: uuid
            required:
              - imageBase64
              - mimeType
    responses:
      '200':
        description: Shopping list items identified
        content:
          application/json:
            schema:
              $ref: '../schemas/ai.yaml#/AIShoppingListResult'
      '400':
        description: Invalid image
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'
      '429':
        description: AI rate limit exceeded
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'

