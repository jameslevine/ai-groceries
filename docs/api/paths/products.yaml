products-search:
  get:
    tags:
      - Products
    summary: Search products
    description: Searches the product database by name, brand, or category.
    operationId: searchProducts
    parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 2
        description: Search query
        example: semi skimmed milk
      - name: category
        in: query
        schema:
          type: string
        description: Filter by category
      - name: store
        in: query
        schema:
          $ref: '../schemas/common.yaml#/UKSupermarket'
        description: Filter by store
      - name: limit
        in: query
        schema:
          type: integer
          default: 20
          maximum: 100
    responses:
      '200':
        description: Product search results
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../schemas/common.yaml#/PaginatedResponse'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '../schemas/product.yaml#/Product'
      '400':
        description: Search query too short
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'

products-barcode:
  get:
    tags:
      - Products
    summary: Look up product by barcode
    description: Returns product details and prices for a given barcode (EAN-13 or UPC).
    operationId: getProductByBarcode
    parameters:
      - name: barcode
        in: path
        required: true
        schema:
          type: string
        description: Product barcode (EAN-13 or UPC)
        example: '5000128000505'
    responses:
      '200':
        description: Product found with prices
        content:
          application/json:
            schema:
              $ref: '../schemas/product.yaml#/PriceComparison'
      '404':
        description: Product not found for this barcode
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'

products-productId:
  get:
    tags:
      - Products
    summary: Get product by ID
    description: Returns full product details.
    operationId: getProductById
    parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: Product details
        content:
          application/json:
            schema:
              $ref: '../schemas/product.yaml#/Product'
      '404':
        description: Product not found
        content:
          application/json:
            schema:
              $ref: '../schemas/common.yaml#/ErrorResponse'

products-categories:
  get:
    tags:
      - Products
    summary: Get product categories
    description: Returns all product categories with subcategories and product counts.
    operationId: getProductCategories
    responses:
      '200':
        description: Product categories
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    $ref: '../schemas/product.yaml#/ProductCategory'
