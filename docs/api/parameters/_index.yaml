# ==================== Common Parameters ====================
limitParam:
  name: limit
  in: query
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 20
  description: Maximum number of items to return

lastKeyParam:
  name: lastKey
  in: query
  schema:
    type: string
  description: Encoded pagination cursor from previous response for fetching next page

listIdParam:
  name: listId
  in: path
  required: true
  schema:
    type: string
    format: uuid
  description: Shopping list unique identifier

itemIdParam:
  name: itemId
  in: path
  required: true
  schema:
    type: string
    format: uuid
  description: Item unique identifier

recipeIdParam:
  name: recipeId
  in: path
  required: true
  schema:
    type: string
    format: uuid
  description: Recipe unique identifier

mealIdParam:
  name: mealId
  in: path
  required: true
  schema:
    type: string
    format: uuid
  description: Meal plan entry unique identifier

productIdParam:
  name: productId
  in: path
  required: true
  schema:
    type: string
    format: uuid
  description: Product unique identifier

barcodeParam:
  name: barcode
  in: path
  required: true
  schema:
    type: string
  description: Product barcode (EAN-13 or UPC)

startDateParam:
  name: startDate
  in: query
  required: true
  schema:
    type: string
    format: date
  description: Start date (ISO 8601 format, e.g. 2025-06-23)

endDateParam:
  name: endDate
  in: query
  required: true
  schema:
    type: string
    format: date
  description: End date (ISO 8601 format, e.g. 2025-06-29)

storeParam:
  name: store
  in: query
  schema:
    type: string
    enum:
      - TESCO
      - SAINSBURYS
      - ASDA
      - MORRISONS
      - ALDI
      - LIDL
      - WAITROSE
      - OCADO
      - COOP
      - MS_FOOD
  description: UK supermarket filter

categoryParam:
  name: category
  in: query
  schema:
    type: string
  description: Product/item category filter

locationParam:
  name: location
  in: query
  schema:
    type: string
  description: Inventory location filter

searchQueryParam:
  name: q
  in: query
  schema:
    type: string
    minLength: 1
    maxLength: 200
  description: Search query string
